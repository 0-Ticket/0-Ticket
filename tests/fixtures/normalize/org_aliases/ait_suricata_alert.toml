# 조직 덮어쓰기 예시(테스트용). 기본 표와 같은 파일 이름이라 기본 표 대신 이 표가 쓰인다(K36).
# 이 조직은 Suricata 심각도 1을 Critical(5)로 본다.
scenario = "ait_suricata_alert"
kind = "alert"
class_uid = 2004
time_format = "iso8601"

[severity_map]
"1" = 5
"2" = 3
"3" = 2

[fields]
time = ["timestamp"]
severity_id = ["alert.severity"]
rule_id = ["alert.signature_id"]
rule_name = ["alert.signature"]
src_ip = ["src_ip"]
src_port = ["src_port"]
dst_ip = ["dest_ip"]
dst_port = ["dest_port"]
