# 가짜 시나리오 별칭 표(테스트용). AIT 표와 필드 이름이 전혀 다른 WAF 알럿을
# 코드 수정 없이 이 파일 하나로 C3에 맞춘다(K4). 조직 폴더(normalize.alias_dir)로 넣는다.
scenario = "fake_waf_alert"
kind = "alert"
class_uid = 2004
time_format = "epoch_ms"
default_techniques = ["T1190"]

[severity_map]
critical = 5
warning = 3

[fields]
time = ["@timestamp"]
severity_id = ["rule.level"]
rule_id = ["rule.id"]
rule_name = ["rule.name"]
# 첫 후보가 없으면 다음 후보를 쓴다.
src_ip = ["src.ip", "client.address"]
src_port = ["client.port"]
dst_ip = ["server.address"]
dst_port = ["server.port"]
host = ["observer.hostname"]
# 빈 문자열은 "없음"이라 다음 후보로 넘어간다.
user = ["account", "user.name"]
http_url = ["request.uri"]
http_status = ["response.status"]
techniques = ["threat.technique"]

[extensions_map]
tenant = "acme.tenant"
