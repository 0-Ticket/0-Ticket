# direct 어댑터 예시 설정 (개발·테스트·데모용). 경로는 레포 루트 기준.
# 손으로 만든 AIT 형식 샘플만 가리킨다. 데이터셋 원본은 커밋하지 않는다.
[siem]
adapter = "direct"

[[siem.direct.files]]
path = "tests/fixtures/ingest/ait/suricata_eve.jsonl"
kind = "alert"
scenario = "ait_suricata_alert"
source_type = "web"
format = "jsonl"

[[siem.direct.files]]
path = "tests/fixtures/ingest/ait/apache_access.log"
kind = "event"
scenario = "ait_apache_access"
source_type = "web"
format = "text"
