# Integration test settings (#81): the demo flow on a small hand-made sample.
# Same shape as config/demo/settings.toml. Paths are read from the repo root.
# The LLM, the vector store and the embedder are test fakes the test registers by name.

[siem]
adapter = "direct"

[[siem.direct.files]]
path = "tests/fixtures/flow/wazuh_alert.jsonl"
kind = "alert"
tool = "wazuh"
log_type = "alert"
source_type = "web"
format = "jsonl"

[[siem.direct.files]]
path = "tests/fixtures/flow/access.log"
kind = "event"
tool = "apache"
log_type = "access"
source_type = "web"
format = "text"

[llm]
provider = "fake"
model = "fake-model"

[vector_store]
backend = "fake"

[embedder]
provider = "fake"

[branch]
rules_dir = "tests/fixtures/flow/rules"

[mcp.allowed_tools]
l1 = ["query_siem", "query_records", "get_alert"]
web_specialist = ["query_records", "get_alert", "query_http_flow"]
