# 개발용 PostgreSQL(D-005)과 Qdrant(D-006). 운영 배포용이 아니다.
# 실행: cp .env.example .env (POSTGRES_* 값 채움) → docker compose up -d
# 포트는 이 컴퓨터(127.0.0.1)에서만 열린다.
name: zero-ticket-soc

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333" # HTTP
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
