# Logstash grok(ECS)로 파싱해 Elasticsearch에 넣은 웹 접근로그(elastic 어댑터 #99) → C13. 박스 4 기본 별칭 표(C20).
# elastic 어댑터가 점 표기 키를 중첩으로 펼치므로 아래 점 경로는 두 표기 모두에 맞는다.
tool = "logstash"
log_type = "http_access"
mapping_profile = "elastic_access_event"
kind = "event"
# OCSF HTTP Activity
class_uid = 4002
activity = "http_request"
# 예: 2026-10-21T01:01:05.000Z
time_format = "iso8601"

# http_status: 이 랩의 http.response.status_code는 접근로그 응답 코드라 정수로 믿을 수 있다(Web 전문가 근거 표에 쓰인다).
# user_agent.original은 C13에 맞는 필드가 없어 unmapped에 남는다. 목적지 IP는 원본에 없다.
[fields]
time = ["@timestamp"]
src_ip = ["source.address", "source.ip"]
http_url = ["url.original"]
http_status = ["http.response.status_code"]
