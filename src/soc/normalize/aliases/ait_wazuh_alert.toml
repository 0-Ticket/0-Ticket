# AIT Alert Data Set (AIT-ADS, D-004)의 Wazuh 알럿 → C3. 박스 4 기본 별칭 표(C20).
# AIT-ADS는 AIT Log Data Set V2.0을 Wazuh에 넣어 만든 알럿 모음이다(JSON Lines, 줄 하나가 알럿 하나).
# 조직은 normalize.alias_dir 폴더에 같은 이름의 파일을 두어 이 표를 통째로 바꾼다.
scenario = "ait_wazuh_alert"
kind = "alert"
class_uid = 2004
# 예: 2022-01-24T03:57:26.000000Z
time_format = "iso8601"
default_techniques = []

# Wazuh rule.level(0~15) → severity_id. Wazuh 등급 구간을 OCSF 값에 맞춘다.
# 0~2 → 1 Informational, 3~6 → 2 Low, 7~11 → 3 Medium, 12~14 → 4 High, 15 → 5 Critical.
[severity_map]
"0" = 1
"1" = 1
"2" = 1
"3" = 2
"4" = 2
"5" = 2
"6" = 2
"7" = 3
"8" = 3
"9" = 3
"10" = 3
"11" = 3
"12" = 4
"13" = 4
"14" = 4
"15" = 5

# C3 필드 → 원본 필드 후보. 앞에서부터 찾고 점(.)은 중첩 필드다.
# 디코더마다 IP 필드 이름이 다르다: Apache·sshd는 data.srcip, Suricata eve(86601)는 data.src_ip·data.dest_ip.
# fast.log 경유 IDS 알럿(20100·20101 등)의 data.dstip는 "IP:포트"라 IP로 쓸 수 없다. 시연은 이 알럿을 자를 때 뺀다.
# dst_ip가 없으면 알럿을 만든 호스트(agent.ip)를 쓴다. 웹 알럿(31101 등)은 대상 서버 IP가 이것뿐이다.
# http_status는 매핑하지 않는다. Apache 디코더의 data.id는 접근 로그에서는 응답 코드지만
# 오류 로그(30305 등)에서는 AH01630 같은 오류 코드라, 정수로 바꾸지 못해 알럿이 C12가 된다.
# data.id는 unmapped에 남는다.
[fields]
time = ["@timestamp"]
severity_id = ["rule.level"]
rule_id = ["rule.id"]
rule_name = ["rule.description"]
src_ip = ["data.srcip", "data.src_ip"]
src_port = ["data.srcport", "data.src_port"]
dst_ip = ["data.dstip", "data.dest_ip", "agent.ip"]
dst_port = ["data.dest_port"]
http_url = ["data.url"]
techniques = ["rule.mitre.id"]
