# Kibana Security 탐지 알럿(Elasticsearch, elastic 어댑터 #99) → C3. 박스 6 기본 별칭 표(C20).
# elastic 어댑터는 _source의 점 표기 키("kibana.alert.severity")를 중첩으로 펼쳐 C2 fields에 넣으므로,
# 아래 점 경로는 원본이 점 키든 중첩 객체든 같은 값을 가리킨다.
# 조직은 normalize.alias_dir 폴더에 같은 이름의 파일을 두어 이 표를 통째로 바꾼다.
scenario = "elastic_security_alert"
kind = "alert"
class_uid = 2004
# 예: 2026-10-21T01:01:05.000Z
time_format = "iso8601"
# kibana.alert.rule.threat는 목록 안의 객체라 별칭 경로로 가리킬 수 없다. unmapped에 남는다.
default_techniques = []

# Kibana 알럿 심각도(kibana.alert.severity) → severity_id.
[severity_map]
low = 2
medium = 3
high = 4
critical = 5

# C3 필드 → 원본 필드 후보. 앞에서부터 찾고 점(.)은 중첩 필드다.
# time: 알럿을 만든 시각(@timestamp)보다 원본 이벤트 시각을 먼저 쓴다. SIEM 조회 창과 흐름 조회가 이 시각 기준이다.
# dst_ip: 이 랩의 접근로그에는 목적지 IP가 없다. 가짜 값을 넣지 않고 비워 둔다. 중복 제거 키는 {src_ip}로 만들어진다.
# host: 랩의 host.name은 웹 서버가 아니라 수집기(Logstash)일 수 있어 매핑하지 않는다(unmapped에 남음). 랩 확인 후 정한다.
[fields]
time = ["kibana.alert.original_time", "@timestamp"]
severity_id = ["kibana.alert.severity"]
rule_id = ["kibana.alert.rule.rule_id"]
rule_name = ["kibana.alert.rule.name"]
src_ip = ["source.address", "source.ip"]
http_url = ["url.original"]
http_status = ["http.response.status_code"]
