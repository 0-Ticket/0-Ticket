# AIT Log Data Set V2 (D-004)의 Apache access 로그(combined) → C13. 박스 4 기본 별칭 표(C20).
# direct 어댑터는 줄 하나를 fields.message에 담으므로 parse로 나눈 뒤 별칭을 적용한다.
tool = "apache"
log_type = "access"
mapping_profile = "ait_apache_access"
kind = "event"
# OCSF HTTP Activity
class_uid = 4002
activity = "http_request"
time_format = "%d/%b/%Y:%H:%M:%S %z"

# 공격자가 만든 문자열에 적용되므로 중첩 반복 없이 쓴다(역추적 폭발 방지).
# user가 "-"이면 그룹이 비어 "없음"이 된다.
[parse]
field = "message"
pattern = '(?P<client_ip>\S+) (?P<ident>\S+) (?:-|(?P<user>\S+)) \[(?P<time>[^\]]+)\] "(?P<method>[A-Z]+) (?P<url>\S+) (?P<protocol>[^"]*)" (?P<status>\d{3}) (?P<bytes>\d+|-) "(?P<referrer>[^"]*)" "(?P<user_agent>[^"]*)"'

[fields]
time = ["message.time"]
src_ip = ["message.client_ip"]
user = ["message.user"]
http_url = ["message.url"]
http_status = ["message.status"]
