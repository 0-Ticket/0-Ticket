# 공격 대상 시나리오 규칙 (박스 25). 알럿이 규칙에 맞으면 L1 엔티티 조회를 거치지 않고 시나리오 티켓을 바로 만든다.
# 조직은 [branch] rules_dir 폴더에 같은 이름(scenarios.toml)의 파일을 두어 이 파일을 통째로 바꾼다.
# 폴더의 다른 이름 파일은 규칙을 더한다. 파일 이름 순서, 파일 안에서는 적힌 순서로 보고, 처음 맞는 규칙이 이긴다.
#
# [[scenario]] 하나가 규칙 하나다. 키:
#   id            규칙 ID. 소문자·숫자·밑줄. 모든 파일에서 겹치면 안 된다. C21 reason.rule_id로 남는다.
#   rule_ids      C5 rule_id가 이 중 하나와 같으면 맞는다.
#   techniques    C5 techniques와 하나라도 겹치면 맞는다(ATT&CK 기법 ID).
#                 rule_ids와 techniques 중 하나는 비어 있지 않아야 한다. 둘 다 적으면 어느 쪽이든 맞으면 된다.
#   handling_type Ticket handling_type (등록형, 기본 web_attack, scan, cloud, other).
#   specialist    Ticket specialist. specialists 그룹에 등록된 이름(기본 web) 또는 "none".
#
# 아래는 형식을 보여 주는 샘플 규칙이다. 시연 규칙은 데모 데이터에 맞춰 따로 채운다.

[[scenario]]
id = "sample_web_sqli"
rule_ids = ["sample-31103"]
techniques = ["T1190"]
handling_type = "web_attack"
specialist = "web"
