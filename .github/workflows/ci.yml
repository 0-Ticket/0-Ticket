# PR 검사: 포맷 · 린트 · 계약 생성 코드 · 테스트. AGENTS.md "완료 기준" 2번과 같은 명령을 돌린다.
# 실제 LLM·DB·Qdrant가 필요한 테스트는 마커로 나눠 기본 실행에서 빠진다.
# db 마커 테스트는 아래 db job이 PostgreSQL 서비스 컨테이너로 돌린다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: 포맷 검사
        run: uv run ruff format --check .

      - name: 린트
        run: uv run ruff check .

      - name: 계약 생성 코드 차이 검사
        run: uv run python scripts/generate_contracts.py --check

      - name: 테스트
        run: uv run pytest

  db:
    runs-on: ubuntu-latest
    services:
      # compose.yaml과 같은 이미지. CI 전용 일회용 컨테이너라 비밀번호 없이(trust) 띄운다.
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: DB 테스트
        run: uv run pytest -m db
