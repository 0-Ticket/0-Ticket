# PR 검토: 포맷 · 린트 · 테스트 (LLM 없음)
# AGENTS.md의 "완료 기준" 2번과 같은 명령을 돌린다.
name: CI

on:
  pull_request:
  push:
    branches: [main, review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        name: 화면 검사 대상 확인
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            frontend=false
            while IFS= read -r changed_path; do
              case "$changed_path" in
                frontend/*|contracts/*|tests/fixtures/frontend/*|tests/frontend/*|tools/contracts/*|.github/workflows/ci.yml)
                  frontend=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
            echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: Node 설치 (계약 생성 도구)
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: pnpm 설치 (계약 생성 도구)
        run: npm install --global pnpm@11.9.0

      - name: 계약 생성 도구 설치
        run: pnpm --dir tools/contracts install --frozen-lockfile

      - name: 계약 재생성 차이 검사
        run: uv run python scripts/generate_contracts.py --check

      - name: 포맷 검사
        run: uvx ruff format --check .

      - name: 린트
        run: uvx ruff check .

      - name: 테스트 (실제 LLM 호출 테스트 제외)
        run: uv run pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: 고정된 pnpm 설치
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 타입 검사
        run: pnpm typecheck
      - name: 린트
        run: pnpm lint
      - name: 포맷 검사
        run: pnpm format:check
      - name: 테스트
        run: pnpm test
      - name: 빌드
        run: pnpm build
