# PR 검사: 포맷 · 린트 · 테스트. AGENTS.md "완료 기준" 2번과 같은 명령을 돌린다.
# 실제 LLM·DB·Qdrant가 필요한 테스트는 마커로 나눠 기본 실행에서 빠진다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: 포맷 검사
        run: uv run ruff format --check .

      - name: 린트
        run: uv run ruff check .

      - name: 테스트
        run: uv run pytest
