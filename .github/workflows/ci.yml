# PR 검사: 포맷 · 린트 · 계약 생성 코드 · 테스트. AGENTS.md "완료 기준" 2번과 같은 명령을 돌린다.
# 실제 LLM·DB·Qdrant가 필요한 테스트는 마커로 나눠 기본 실행에서 빠진다.
# db·qdrant 마커 테스트는 아래 db job이 PostgreSQL·Qdrant 서비스 컨테이너로 돌린다.
# embedder 마커(실제 BGE-M3 약 2.27GB)는 CI에서 돌리지 않는다(#257).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: 포맷 검사
        run: uv run ruff format --check .

      - name: 린트
        run: uv run ruff check .

      - name: 계약 생성 코드 차이 검사
        run: uv run python scripts/generate_contracts.py --check

      - name: 테스트
        run: uv run pytest

  db:
    runs-on: ubuntu-latest
    services:
      # compose.yaml과 같은 이미지. CI 전용 일회용 컨테이너라 비밀번호 없이(trust) 띄운다.
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # compose.yaml과 같은 이미지. 이미지 안에 curl·sh가 없어 컨테이너 healthcheck 대신
      # 아래 단계에서 러너의 curl로 /readyz를 기다린다(#257).
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v5

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: Qdrant 준비 대기
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          exit 1

      - name: DB · Qdrant 테스트
        run: uv run pytest -m "db or qdrant"
