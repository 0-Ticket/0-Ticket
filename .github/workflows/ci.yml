# PR 검토: 포맷 · 린트 · 테스트 (LLM 없음)
# AGENTS.md의 "완료 기준" 2번과 같은 명령을 돌린다.
name: CI

on:
  pull_request:
  push:
    branches: [main, review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: Node 설치 (계약 생성 도구)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm 설치 (계약 생성 도구)
        run: npm install --global pnpm@11.9.0

      - name: 계약 생성 도구 설치
        run: pnpm --dir tools/contracts install --frozen-lockfile

      - name: 계약 재생성 차이 검사
        run: uv run python scripts/generate_contracts.py --check

      - name: 포맷 검사
        run: uvx ruff format --check .

      - name: 린트
        run: uvx ruff check .

      - name: 테스트 (실제 LLM 호출 테스트 제외)
        run: uv run pytest
