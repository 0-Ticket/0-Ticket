# 시연 공격 대상 시나리오 규칙 (#79). 형식은 src/soc/branch/rules/scenarios.toml 주석을 본다.
# 이 파일은 기본 샘플 규칙(sample_web_sqli)을 통째로 바꾼다.
# rule_ids는 정규화 결과 C5 rule_id에 실제로 나오는 Wazuh rule.id다(별칭 표 ait_wazuh_alert).
# 데이터 출처: AIT Alert Data Set (AIT-ADS, Zenodo), CC BY 4.0. russellmitchell Wazuh 알럿.
#
# 31104(Common web attack)만 시나리오로 둔다. 시연 구간에서는 dirb 요청(03:57:26, 03:57:33)에서 나온다.
# 31516(Suspicious URL access)은 일부러 넣지 않는다. L1 엔티티 조회 → L1 승격 사례로 쓴다.
# techniques는 비워 둔다. Wazuh가 31516에도 T1055를 붙여 기법으로 맞추면 31516까지 시나리오가 된다.

[[scenario]]
id = "demo_web_attack"
rule_ids = ["31104"]
techniques = []
handling_type = "web_attack"
specialist = "web"
