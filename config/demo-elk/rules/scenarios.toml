# ELK 시연 공격 대상 시나리오 규칙 (#99). 형식은 src/soc/branch/rules/scenarios.toml 주석을 본다.
# 이 파일은 기본 샘플 규칙(sample_web_sqli)을 통째로 바꾼다.
# rule_ids는 정규화 결과 C5 rule_id에 나오는 Kibana 룰 ID(kibana.alert.rule.rule_id)다(별칭 표 elastic_security_alert).
# 랩 룰 "Web Attack - Juice Shop"(a2a-web-attack-juice-shop)은 logs-*에서 5xx 응답이나
# URL의 script·passwd·UNION 등을 찾는다. 룰 추가·튜닝은 랩 레포 소관이다.
# techniques는 비워 둔다. 랩 룰에는 ATT&CK 기법이 별칭 표로 매핑되지 않는다.

[[scenario]]
id = "elk_web_attack"
rule_ids = ["a2a-web-attack-juice-shop"]
techniques = []
handling_type = "web_attack"
specialist = "web"
