# ELK 시연 설정 (#99). ZT_CONFIG로 고르는 덮어쓰기 파일이다. config/default.toml에 있는 키만 바꾼다.
#   export ZT_CONFIG=config/demo-elk/settings.toml
# attack-to-alert 랩(https://github.com/0-Ticket/attack-to-alert, ELK 9.5.5)의 Elasticsearch에서
# Kibana 탐지 알럿과 nginx 접근로그를 읽는다. 실행 순서와 API 키 만들기는 config/demo-elk/README.md.
# AIT 시연(config/demo/)과 별개다. 내부 주소·비밀값이 없어 커밋한다. 다른 주소는 config/local.*에서 바꾼다.
# 상대 경로는 레포 루트 기준이라 명령은 레포 루트에서 실행한다.

[siem]
# Elasticsearch + Kibana Security (D-037의 확장 ELK).
adapter = "elastic"
base_url = "http://localhost:9200"
# 읽기 전용 ES API 키(encoded 값)를 담은 환경변수 이름. 값은 .env에만 둔다.
token_env = "SIEM_TOKEN"

# 인덱스는 기본값(.alerts-security.alerts-*, logs-*)을 그대로 쓴다. 매핑 선택은 C20 pair로 한다.
[siem.elastic]
alert_tool = "kibana_security"
alert_log_type = "security_alert"
event_tool = "logstash"
event_log_type = "http_access"

[branch]
# 랩 탐지 룰을 시나리오로 둔다. 같은 이름(scenarios.toml)이라 기본 샘플 규칙을 통째로 바꾼다.
rules_dir = "config/demo-elk/rules"

[mcp.allowed_tools]
# L1 Agent: SIEM 조회(elastic SIEM MCP 어댑터)와 내부 데이터 조회.
l1 = ["query_siem", "query_records", "get_alert"]
# Web 전문가 Agent: 내부 데이터와 HTTP 흐름 조회.
web_specialist = ["query_records", "get_alert", "query_http_flow"]
