# 기본 설정. config/local.toml(커밋하지 않음)이 같은 키를 덮어쓴다(설정 파일 TOML, D-002).
# 비밀 값은 넣지 않는다. 키·주소처럼 비밀인 값은 환경변수 이름만 적는다(*_env).

[llm]
# OpenAI 호환 Chat Completions 제공자 하나에 연결한다(기본 LLM, D-009).
# base_url·model이 비어 있으면 run_agent는 provider_error를 돌려준다. 실제 값은 config/local.toml에 둔다.
base_url = ""
model = ""
# 키를 담은 환경변수 이름. 키가 필요 없는 제공자(Ollama)는 빈 문자열로 둔다.
api_key_env = "LLM_API_KEY"
# 도구 정의의 strict 사용 여부. 적용은 도구 레지스트리(#211), 제공자 수용 여부 확인은 #215.
strict_mode = true
# 모델 호출 한 번의 타임아웃(초). 넘으면 provider_error.
timeout_seconds = 60
# 429일 때 다시 부르는 횟수. Retry-After(초) 또는 1·2·4초를 기다리고(최대 60초), 넘으면 rate_limited.
rate_limit_retries = 3

# 제공자 예시. config/local.toml의 [llm]에 아래 중 하나를 넣는다. 키 값은 .env에만 둔다.
# Azure Foundry (기본):
#   base_url = "https://<리소스 이름>.openai.azure.com/openai/v1/"
#   model = "<배포 이름>"
#   api_key_env = "LLM_API_KEY"
# Groq:
#   base_url = "https://api.groq.com/openai/v1"
#   model = "openai/gpt-oss-120b"
#   api_key_env = "LLM_API_KEY"
# Ollama (키 없음):
#   base_url = "http://localhost:11434/v1"
#   model = "gpt-oss:120b"   # 또는 "gpt-oss:20b"
#   api_key_env = ""

# 단계별 설정.
# max_turns: 모델 호출 상한. 넘으면 budget_exceeded.
# max_input_chars: 한 호출에 보내는 system 지시 + 입력 항목(JSON) 글자 수 상한. 넘으면 보내지 않고 budget_exceeded.
# reasoning_effort: Chat Completions의 reasoning_effort(low | medium | high).
# max_tool_result_chars: 모델에게 보내는 도구 결과 JSON 본문의 글자 수 상한. 넘으면 뒤 레코드부터 뺀다(#211).
[agent.l1]
max_turns = 6
max_input_chars = 32000
reasoning_effort = "low"
max_tool_result_chars = 6000

[agent.l2]
max_turns = 12
max_input_chars = 64000
reasoning_effort = "medium"
max_tool_result_chars = 8000

[agent.l3]
max_turns = 10
max_input_chars = 48000
reasoning_effort = "medium"
max_tool_result_chars = 8000

[tools]
# 도구 레지스트리(도구 구현 방식, D-023, #211). 내부 데이터·Web 도구는 환경변수 AGENT_DATABASE_URL
# (읽기 역할 soc_agent_reader의 멤버 계정)로 alerts·events만 읽는다.
# DB 문장 시간 상한(밀리초). 넘으면 TOOL_ERROR code=timeout
statement_timeout_ms = 5000
# 접속 시간 상한(초). 접속이 안 되면 TOOL_ERROR code=unavailable
connect_timeout_seconds = 5
# 시간 범위 인자(start_ms~end_ms)로 한 번에 볼 수 있는 일 수
max_range_days = 7
# 목록 도구의 limit 기본값과 상한
default_limit = 20
max_limit = 100

# 단계별 허용 도구. 여기에 없는 도구는 모델에게 등록되지 않는다(기본 전부 거부).
# 레지스트리에 없는 이름을 적으면 실행이 provider_error로 끝난다.
[tools.allowed]
# SIEM 도구(#212): query_siem은 l1·l2·l3, count_siem은 l2·l3
# SSH 점검 도구(#213): run_host_check는 l2·l3. [[tools.ssh.hosts]]가 비어 있으면 등록되지 않는다
l1 = [
    "get_alert", "get_event", "query_records", "query_http_flow", "summarize_http_flow",
    "query_siem",
]
l2 = [
    "get_alert", "get_event", "query_records", "query_http_flow", "summarize_http_flow",
    "query_siem", "count_siem", "run_host_check",
]
l3 = [
    "get_alert", "get_event", "query_records", "query_http_flow", "summarize_http_flow",
    "query_siem", "count_siem", "run_host_check",
]

# SIEM 조회 도구(#212). 수집(#218)과 같은 ELK에 같은 환경변수로 접속한다.
# SIEM 연결·프로필(D-021)이 생기면 그것으로 바꾼다.
# 부르는 API는 POST /<index>/_search 하나다. 키는 대상 인덱스의 read 권한만 있는 API 키(D-010).
[tools.siem]
# ELK 주소(http(s), 계정 정보 없이)와 읽기 전용 API 키를 담은 환경변수 이름. 값은 .env에만 둔다
url_env = "ELK_URL"
api_key_env = "ELK_API_KEY"
# 요청 단위 제한 시간(초). 넘으면 TOOL_ERROR code=timeout
connect_timeout_seconds = 5
read_timeout_seconds = 10
# 호출 한 번의 전체 마감 시간(초, D-039). 넘으면 TOOL_ERROR code=timeout
deadline_seconds = 15
# 응답 크기 상한(압축을 푼 바이트). 넘으면 끊고 TOOL_ERROR code=failed
max_bytes = 5_242_880  # 5MB

# 조회 대상. name은 코드에 정해진 alerts | web_access | cloudtrail 중 하나다(다른 이름은 provider_error).
# 대상별 필터·반환 필드는 코드(soc.tools.siem)에 있다. 여기서는 index·time_field만 붙인다.
# 아래 index는 예시(#218 [[ingest.sources]]와 같은 패턴)다. 실제 값은 config/local.toml에서 바꾼다.
# 대상을 빼면 모델이 그 대상을 고를 때 invalid_argument다.
[[tools.siem.targets]]
name = "alerts"
index = ".alerts-security.alerts-default"
time_field = "@timestamp"

[[tools.siem.targets]]
name = "web_access"
index = "logs-nginx.access-*,logs-apache.access-*"
time_field = "@timestamp"

[[tools.siem.targets]]
name = "cloudtrail"
index = "logs-aws.cloudtrail-*"
time_field = "@timestamp"

# SSH 호스트 점검 도구(#213, SSH 도구 D-011, asyncssh D-041). 읽기 전용 계정으로 접속한다.
# 점검(processes, listening_ports, recent_logins, auth_log_tail, file_hash)의 명령과 인자 모양은
# 코드(soc.tools.ssh)에 있다. 설정은 호스트마다 켤 점검만 정하고, 명령 문자열은 받지 않는다.
[tools.ssh]
# OpenSSH 개인 키 본문(여러 줄)을 담은 환경변수 이름. 키 파일 경로는 두지 않는다. 값은 .env에만 둔다
key_env = "SSH_TOOL_PRIVATE_KEY"
# 암호가 걸린 키의 암호를 담은 환경변수 이름. 빈 문자열이면 쓰지 않는다(예: "SSH_TOOL_KEY_PASSPHRASE")
passphrase_env = ""
# 접속·명령 제한 시간(초). 넘으면 TOOL_ERROR code=timeout
connect_timeout_seconds = 5
command_timeout_seconds = 10
# 호출 한 번의 전체 마감 시간(초, D-039와 같은 뜻). 넘으면 TOOL_ERROR code=timeout
deadline_seconds = 15
# stdout·stderr를 각각 이 바이트까지만 읽는다. stdout이 넘으면 끊고 stdout_truncated=true(오류 아님)
max_output_bytes = 65_536  # 64KB
# 결과에 담는 stderr 앞부분 글자 수
max_stderr_chars = 2000
# 점검할 호스트. 기본은 비어 있어 도구가 등록되지 않는다(전부 거부).
# 실제 값은 config/local.toml(커밋 안 함)에 [[tools.ssh.hosts]]로 적는다. 예:
#   [[tools.ssh.hosts]]
#   name = "web01"                 # 모델에게 보이는 이름. [a-z0-9-], 주소·계정을 넣지 않는다
#   address = "192.0.2.10"         # 호스트 이름 또는 IP(계정 없이)
#   port = 22
#   username = "soc-reader"        # 읽기 권한만 가진 계정
#   host_key = "ssh-ed25519 AAAA…" # 공개 호스트 키 한 줄(ssh-keyscan 결과에서 호스트 이름을 뺀 것)
#   checks = ["processes", "listening_ports", "recent_logins", "auth_log_tail", "file_hash"]
hosts = []

# L3 가설 재료 수집(#221, L3 위협 시나리오 입력 D-029). 모두 공개 피드라 비밀 값이 없다.
# 실행: uv run python -m soc.l3.intel
[l3.intel]
# 요약(태그를 지운 평문) 길이 상한. 넘으면 자른다
summary_max_chars = 1000
# 요청 단위 제한 시간(초). 출처별 전체 마감 시간은 limits·attack의 deadline_seconds
connect_timeout_seconds = 10
read_timeout_seconds = 10

# 출처 종류별 응답 크기 상한(압축을 푼 바이트)과 전체 마감 시간(초)
[l3.intel.limits.rss]
max_bytes = 5_242_880  # 5MB
deadline_seconds = 30

[l3.intel.limits.cisa_kev]
max_bytes = 10_485_760  # 10MB
deadline_seconds = 30

# 출처 목록. name은 저장 키의 일부라, 바꾸면 같은 기사가 새로 저장된다.
# kind: rss | cisa_kev. 주소는 https만 받는다. 리다이렉트는 따라가지 않는다.
[[l3.intel.sources]]
name = "boannews"
kind = "rss"
url = "https://cdn.boannews.com/rss/gn_rss_allArticle.xml"

[[l3.intel.sources]]
name = "thehackernews"
kind = "rss"
url = "https://feeds.feedburner.com/TheHackersNews"

[[l3.intel.sources]]
name = "cisa_kev"
kind = "cisa_kev"
url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"

# MITRE ATT&CK Enterprise(D-040). 같은 버전이 이미 저장돼 있으면 내려받지 않는다.
# 버전을 올릴 때는 version과 url을 함께 바꾼다. 받은 파일의 버전이 다르면 실패한다.
[l3.intel.attack]
version = "20.0"
url = "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack-20.0.json"
max_bytes = 104_857_600  # 100MB
deadline_seconds = 180
