# 0-Ticket SOC 기본 설정 (D-015). 레포에 커밋하고 비밀 값은 넣지 않는다.
# 조직 설정은 환경변수 ZT_CONFIG가 가리키는 파일에 두며, 이 파일에 있는 키만 덮어쓸 수 있다.
# 비밀 값이 필요한 곳에는 환경변수 이름만 적고(`*_env`), 값은 .env에 둔다.
# 새 설정 값을 추가할 때는 바로 위에 한 줄 설명을 적는다.

# PostgreSQL 연결 (D-002)
[database]
# 연결 URL을 담은 환경변수 이름. 값(postgresql://...)은 .env에만 둔다.
url_env = "DATABASE_URL"
# 에이전트 도구(박스 15)가 쓰는 읽기 전용 계정 URL을 담은 환경변수 이름.
# SELECT 권한만 준 계정을 적는다. 코드는 연결에 읽기 전용 트랜잭션도 함께 걸어
# 권한이 넓게 잡혀 있어도 쓰기가 실패하게 한다(docs/security-policy.md 4항).
readonly_url_env = "DATABASE_READONLY_URL"
# 연결을 기다리는 최대 시간(초). 1 이상.
connect_timeout_seconds = 5

# 저장소 (D-002). 모든 저장소는 stores 그룹에 "<backend>.<저장소 종류>" 이름으로 등록된다.
[store]
# 저장소 백엔드 이름. 소문자·숫자·밑줄만. 예: "postgresql"이면 Alert·Event 저장소는 "postgresql.records".
backend = "postgresql"
# SIEM에서 가져온 원본 Alert·Event(박스 6·7)를 보관할 일수. 0이면 무기한(기본). 0 이상.
# 정규화 결과가 가리키는 원본은 기간이 지나도 지우지 않는다.
raw_retention_days = 0

# OCSF 정규화 (박스 4, D-017, D-029). 시나리오별 별칭 표(C20)로 원본 C2를 C3·C13으로 바꾼다.
[normalize]
# 조직 별칭 표 폴더. 이 폴더의 <scenario>.toml이 같은 이름의 기본 표를 통째로 바꾼다. 비우면 기본 표만 쓴다.
alias_dir = ""
# 한 번에 읽어 정규화하는 원본 건수. 1 이상.
batch_size = 500
# 별칭 표 parse 정규식을 적용할 값의 최대 길이(문자). 더 길면 정규식을 돌리지 않고 bad_value로 남긴다. 1 이상.
max_parse_length = 16384

# Lookup (박스 5). 정규화 결과와 증거 요청 큐의 lookup 요청에 자산·계정 정보를 붙이는 조회 제공자.
[lookup]
# lookups 그룹에 등록된 조회 제공자 이름. 소문자·숫자·밑줄만.
# "csv"는 CSV로 적재한 자산·계정 표(RDB)를 읽는다(적재: python -m soc.normalize.lookup.load). "none"은 아무것도 찾지 않는다(null).
provider = "csv"

# Box 12 large-result artifacts. The directory is ignored by git because it is under data/.
[agent_log]
# Directory for the remainder of large tool results; paths stored in PostgreSQL are relative to it.
artifact_dir = "data/agent_log"

# LLM 제공자 설정 (D-008, D-009)
[llm]
# 등록된 제공자 이름.
provider = "openai_compatible"
# 기본 모델 이름. Granite 4.0 Micro는 Ollama에서 이 이름으로 제공한다.
model = "granite4:micro"
# OpenAI 호환 API의 기본 주소.
base_url = "http://localhost:11434/v1"
# 키가 필요할 때 값을 읽을 환경변수 이름. 로컬 Ollama는 비워도 된다.
api_key_env = "LLM_API_KEY"
# 판정 재현성을 위해 기본 무작위성을 최소화한다.
temperature = 0

# 에이전트별 모델 덮어쓰기. 새 에이전트 이름을 추가할 수 있다.
[llm.agents]

# SIEM 커넥터 (박스 3, D-037). 외부 SIEM 하나에만 연결한다.
[siem]
# 등록된 SIEM 어댑터 이름. 기본값은 비어 있어 조직 설정에서 반드시 고른다. SIEM이 없는 개발·테스트·데모만 "direct".
adapter = ""
# SIEM 접속 주소 (예: https://siem.example.com). direct는 쓰지 않는다.
base_url = ""
# SIEM 인증 토큰을 담은 환경변수 이름. 값은 .env에만 둔다.
token_env = "SIEM_TOKEN"
# SIEM TLS 인증서를 검증할지 여부.
verify_tls = true
# SIEM 요청 하나를 기다리는 최대 시간(초). 1 이상.
timeout_seconds = 10
# 한 번에 가져오는 알럿·이벤트 최대 건수. 1 이상.
batch_size = 500

# direct 어댑터 (SIEM 없이 데이터셋 재생, 개발·테스트·데모용)
[siem.direct]
# 재생할 파일 목록. 조직 설정에서 [[siem.direct.files]]로 적는다. 상대 경로는 실행 위치 기준.
# 항목: path, kind("alert"|"event"), scenario(C2 scenario), source_type(C1, 기본 "web"), format("text"|"jsonl").
# 파일 이름(raw_id에 쓰임)은 서로 달라야 한다. 예시는 tests/fixtures/ingest/direct.toml.
files = []

# MCP 도구 (박스 15, D-041). 에이전트가 도구를 부르는 유일한 경로다. SIEM MCP 어댑터는 siem.adapter로 함께 고른다(D-037).
[mcp]
# 조회 하나가 돌려줄 수 있는 최대 건수. 수집 배치(siem.batch_size)와 별개 값이다. 1 이상.
max_query_limit = 500

# 에이전트별 허용 도구. 기본은 비어 있어 모든 도구 호출이 거부된다.
# 조직 설정에서 `에이전트 이름 = ["도구", ...]`로 적는다. 여기에 없는 에이전트 이름도 더할 수 있다.
# 기본 제공 도구: query_siem(SIEM MCP), query_records·get_alert(내부 데이터),
# query_http_flow(Web 도메인). 조직 설정 예시:
#   l1 = ["query_siem", "query_records", "get_alert"]
#   web_specialist = ["query_records", "get_alert", "query_http_flow"]
[mcp.allowed_tools]

# 전문가 Agent (박스 13·14). 도메인별 구현체는 specialists 그룹에 등록하고 C22 domain 값으로 고른다(기본 web).
[specialist]
# 알럿 앞뒤로 같은 출발지의 요청 흐름을 몇 분까지 볼지. 1 이상.
flow_window_minutes = 30
# 흐름 조회 한 번이 가져올 최대 건수. 1 이상. mcp.max_query_limit보다 크면 그 값으로 줄인다.
flow_limit = 200

# 증거 요청 큐 (박스 26, D-034). 요청을 들어온 순서대로 하나씩 처리한다.
[evidence_queue]
# evidence_queues 그룹에 등록된 큐 구현체 이름. 소문자·숫자·밑줄만.
backend = "postgresql"
# 첫 시도가 실패한 뒤 다시 시도하는 횟수 N(L1·L2 공통). 0 이상. 다 실패하면 요청은 failed가 된다.
max_retries = 3

# L1 Alert decisions (box 11, D-036).
[l1]
# Verdict confidence needed to promote an Alert. Values are from 0 to 1.
confidence_threshold = 0.8
# Minutes before and after the Alert time queried through SIEM MCP.
siem_window_minutes = 5
# Maximum number of similar decided Tickets included in the L1 context.
similar_tickets = 5

# 벡터 저장소 (박스 8, D-003). 구현체는 vector_stores 그룹에서 고른다.
[vector_store]
# 등록된 벡터 저장소 구현체 이름.
backend = "qdrant"
# Qdrant HTTP 주소. 주소에 비밀 값이나 API 키를 넣지 않는다.
url = "http://localhost:6333"
# C19에서 종결 Ticket만 넣는 컬렉션.
collection = "closed_tickets"
# Qdrant 요청 제한 시간(초).
timeout_seconds = 10

# 임베딩 제공자 (박스 8, D-010). 모델은 로컬 Ollama에서 실행한다.
[embedder]
# embedders 그룹에 등록된 제공자 이름.
provider = "ollama"
# Ollama 서버의 기본 주소. 임베딩 경로는 코드에서 /api/embed를 붙인다.
base_url = "http://localhost:11434"
# 등록된 로컬 임베딩 모델 이름.
model = "bge-m3"
# BGE-M3가 돌려주는 벡터 차원.
dimensions = 1024
# 임베딩 요청 제한 시간(초).
timeout_seconds = 60

# Ticket 유사 검색 결과를 합치는 방식. 기본값은 Reciprocal Rank Fusion.
[vector_search]
# keyword_first, rrf, weighted_rrf, dbsf, weighted_score 중 하나.
fusion_method = "rrf"
# 가중 결합 방식에서 정확 키워드 검색 결과에 적용할 비중.
keyword_weight = 1.0
# 가중 결합 방식에서 의미 벡터 검색 결과에 적용할 비중.
vector_weight = 1.0
# RRF 역순위 점수의 평활 상수.
rrf_rank_constant = 60
