# 0-Ticket SOC 기본 설정 (D-015). 레포에 커밋하고 비밀 값은 넣지 않는다.
# 조직 설정은 환경변수 ZT_CONFIG가 가리키는 파일에 두며, 이 파일에 있는 키만 덮어쓸 수 있다.
# 비밀 값이 필요한 곳에는 환경변수 이름만 적고(`*_env`), 값은 .env에 둔다.
# 새 설정 값을 추가할 때는 바로 위에 한 줄 설명을 적는다.

# PostgreSQL 연결 (D-002)
[database]
# 연결 URL을 담은 환경변수 이름. 값(postgresql://...)은 .env에만 둔다.
url_env = "DATABASE_URL"
# 연결을 기다리는 최대 시간(초). 1 이상.
connect_timeout_seconds = 5

# LLM 제공자 설정 (D-008, D-009)
[llm]
# 등록된 제공자 이름.
provider = "openai_compatible"
# 기본 모델 이름. Granite 4.0 Micro는 Ollama에서 이 이름으로 제공한다.
model = "granite4:micro"
# OpenAI 호환 API의 기본 주소.
base_url = "http://localhost:11434/v1"
# 키가 필요할 때 값을 읽을 환경변수 이름. 로컬 Ollama는 비워도 된다.
api_key_env = "LLM_API_KEY"
# 판정 재현성을 위해 기본 무작위성을 최소화한다.
temperature = 0

# 에이전트별 모델 덮어쓰기. 새 에이전트 이름을 추가할 수 있다.
[llm.agents]

# SIEM 커넥터 (박스 3, D-037). 외부 SIEM 하나에만 연결한다.
[siem]
# 등록된 SIEM 어댑터 이름. 기본값은 비어 있어 조직 설정에서 반드시 고른다. SIEM이 없는 개발·테스트·데모만 "direct".
adapter = ""
# SIEM 접속 주소 (예: https://siem.example.com). direct는 쓰지 않는다.
base_url = ""
# SIEM 인증 토큰을 담은 환경변수 이름. 값은 .env에만 둔다.
token_env = "SIEM_TOKEN"
# SIEM TLS 인증서를 검증할지 여부.
verify_tls = true
# SIEM 요청 하나를 기다리는 최대 시간(초). 1 이상.
timeout_seconds = 10
# 한 번에 가져오는 알럿·이벤트 최대 건수. 1 이상.
batch_size = 500

# direct 어댑터 (SIEM 없이 데이터셋 재생, 개발·테스트·데모용)
[siem.direct]
# 재생할 파일 목록. 조직 설정에서 [[siem.direct.files]]로 적는다. 상대 경로는 실행 위치 기준.
# 항목: path, kind("alert"|"event"), scenario(C2 scenario), source_type(C1, 기본 "web"), format("text"|"jsonl").
# 파일 이름(raw_id에 쓰임)은 서로 달라야 한다. 예시는 tests/fixtures/ingest/direct.toml.
files = []

# MCP 도구 (박스 15, D-041). 에이전트가 도구를 부르는 유일한 경로다. SIEM MCP 어댑터는 siem.adapter로 함께 고른다(D-037).
[mcp]
# 조회 하나가 돌려줄 수 있는 최대 건수. 수집 배치(siem.batch_size)와 별개 값이다. 1 이상.
max_query_limit = 500

# 에이전트별 허용 도구. 기본은 비어 있어 모든 도구 호출이 거부된다.
# 조직 설정에서 `에이전트 이름 = ["도구", ...]`로 적는다. 여기에 없는 에이전트 이름도 더할 수 있다.
[mcp.allowed_tools]
