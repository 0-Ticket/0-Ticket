# 기본 설정. config/local.toml(커밋하지 않음)이 같은 키를 덮어쓴다(설정 파일 TOML, D-002).
# 비밀 값은 넣지 않는다. 키·주소처럼 비밀인 값은 환경변수 이름만 적는다(*_env).

[llm]
# OpenAI 호환 Chat Completions 제공자 하나에 연결한다(기본 LLM, D-009).
# base_url·model이 비어 있으면 run_agent는 provider_error를 돌려준다. 실제 값은 config/local.toml에 둔다.
base_url = ""
model = ""
# 키를 담은 환경변수 이름. 키가 필요 없는 제공자(Ollama)는 빈 문자열로 둔다.
api_key_env = "LLM_API_KEY"
# 도구 정의의 strict 사용 여부(적용은 도구 레지스트리, #211). 기본 LLM(Foundry)은 strict를 켜면
# 최종 답이 빈 문자열로 와서 끈다(#224 실측, #215). strict를 받는 제공자는 local.toml에서 켤 수 있다.
strict_mode = false
# 모델 호출 한 번의 타임아웃(초). 넘으면 provider_error.
timeout_seconds = 60
# 429일 때 다시 부르는 횟수. Retry-After(초) 또는 1·2·4초를 기다리고(최대 60초), 넘으면 rate_limited.
rate_limit_retries = 3

# 제공자 예시. config/local.toml의 [llm]에 아래 중 하나를 넣는다. 키 값은 .env에만 둔다.
# Azure Foundry (기본):
#   base_url = "https://<리소스 이름>.openai.azure.com/openai/v1/"
#   model = "<배포 이름>"
#   api_key_env = "LLM_API_KEY"
# Groq:
#   base_url = "https://api.groq.com/openai/v1"
#   model = "openai/gpt-oss-120b"
#   api_key_env = "LLM_API_KEY"
# Ollama (키 없음):
#   base_url = "http://localhost:11434/v1"
#   model = "gpt-oss:120b"   # 또는 "gpt-oss:20b"
#   api_key_env = ""

# Agent Log 쓰기(#278). 줄을 쓸 때마다 짧은 연결을 열고, 쓰기 마감은 두 값의 합(기본 약 10초)이다.
# log_connect_timeout_seconds: DB 연결 시간 제한(초).
# log_statement_timeout_ms: 쓰기 문장 시간 제한(밀리초).
[agent]
log_connect_timeout_seconds = 5
log_statement_timeout_ms = 5000

# 단계별 설정.
# max_turns: 모델 호출 상한. 넘으면 budget_exceeded.
# max_input_chars: 한 호출에 보내는 system 지시 + 입력 항목(JSON) 글자 수 상한. 넘으면 보내지 않고 budget_exceeded.
# reasoning_effort: Chat Completions의 reasoning_effort(low | medium | high).
# max_tool_result_chars: 모델에게 보내는 도구 결과 JSON 본문의 글자 수 상한. 넘으면 뒤 레코드부터 뺀다(#211).
[agent.l1]
confidence_threshold = 0.8
max_turns = 6
max_input_chars = 32000
reasoning_effort = "low"
max_tool_result_chars = 6000

[agent.l2]
max_turns = 12
max_input_chars = 64000
reasoning_effort = "medium"
max_tool_result_chars = 8000

[agent.l3]
max_turns = 10
max_input_chars = 48000
reasoning_effort = "medium"
max_tool_result_chars = 8000

# 실행기(#215). 실행: uv run python -m soc.agent (Ctrl+C·SIGTERM으로 끝낸다)
# 단계마다 스레드 하나, 단계 안에서는 한 번에 1건. 한 라운드에 등록 순서대로 워커마다
# poll(poll_limit) → 받은 ID마다 handle을 하고, 라운드가 끝나면 interval_seconds만큼 쉰다.
# 워커가 없거나 interval_seconds = 0인 단계는 돌지 않는다.
# 종료 코드: 0 정상, 1 종료 대기 시간 초과, 2 설정 오류, 3 단계 스레드가 죽음(D-050). 죽은 스레드는
# 다시 시작하지 않는다. 받은 건이 있는 라운드는 워커마다 지표 한 줄(INFO, soc.agent.executor)을 남긴다.
# workers: "soc.<모듈>:build_worker" 목록. build_worker(config)는 설정 전체를 받아 AgentWorker를
# 돌려준다(soc.agent.AgentWorker, docs/plans/215-executor-l1-e2e.md). soc. 밖의 모듈은 받지 않는다.
[executor]
# 종료할 때 진행 중인 run이 cancelled로 끝나기를 기다리는 시간(초). 넘으면 그냥 끝낸다
shutdown_timeout_seconds = 30

[executor.l1]
interval_seconds = 10
poll_limit = 10
workers = ["soc.l1.judge:build_worker"]

[executor.l2]
interval_seconds = 10
poll_limit = 10
workers = ["soc.l2.branch:build_worker", "soc.l2.analyze:build_worker"]

[executor.l3]
# L3는 기본으로 돌지 않는다(L3 실행 방식, D-030). 켤 때는 config/local.toml에서 interval_seconds를
# 바꾼다. 권장: interval_seconds = 600, poll_limit = 10. 환경변수 DATABASE_URL이 필요하다.
# 생성 워커(차례면 수집 → 가설 생성)가 검증 워커보다 앞이라, 새 Hunt가 같은 라운드에서 검증된다(#245)
interval_seconds = 0
poll_limit = 10
workers = ["soc.l3.hunt.generate:build_worker", "soc.l3.hunt.verify:build_worker"]

# 활성화 파이프(#316). 실행: uv run python -m soc.pipeline (Ctrl+C·SIGTERM으로 끝낸다)
# 정규화·Ticket 생성·L1·L2를 한 프로세스에서 주기 실행한다. 수집은 사람이 따로 실행하고, L3는
# [executor.l3] 값과 관계없이 이 명령에서 항상 꺼져 있다. L1·L2 간격은 [executor.l1|l2]를 그대로 쓴다.
# 이 값은 파이프에서만 쓰이며 `python -m soc.agent`는 바뀌지 않는다.
# 종료 코드: 0 정상, 1 종료 대기 시간 초과, 2 설정 오류, 3 단계 스레드가 죽음, 4 준비 점검 실패
[pipeline]
# 정규화·Ticket 생성 한 라운드 뒤 쉬는 시간(초). 처리할 건이 없으면 아무것도 하지 않는다
normalize_interval_seconds = 3
ticketing_interval_seconds = 3
# 종료할 때 진행 중인 run이 cancelled로 끝나기를 기다리는 시간(초). [executor]의 같은 키를 대신한다.
# 정규화·Ticket 생성 배치는 중간에 멈추지 못하므로 이 시간 안에 끝나지 않으면 프로세스가 내려간다
shutdown_timeout_seconds = 30

[tools]
# 도구 레지스트리(도구 구현 방식, D-023, #211). 내부 데이터·Web 도구는 환경변수 AGENT_DATABASE_URL
# (읽기 역할 soc_agent_reader의 멤버 계정)로 alerts·events만 읽는다.
# DB 문장 시간 상한(밀리초). 넘으면 TOOL_ERROR code=timeout
statement_timeout_ms = 5000
# 접속 시간 상한(초). 접속이 안 되면 TOOL_ERROR code=unavailable
connect_timeout_seconds = 5

# 시간 범위 인자(start_ms~end_ms)로 한 번에 볼 수 있는 일 수
max_range_days = 7
# 목록 도구의 limit 기본값과 상한
default_limit = 20
max_limit = 100

# 단계별 허용 도구. 여기에 없는 도구는 모델에게 등록되지 않는다(기본 전부 거부).
# 레지스트리에 없는 이름을 적으면 실행이 provider_error로 끝난다.
[tools.allowed]
# SIEM 도구(#212): query_siem은 l1·l2·l3, count_siem은 l2·l3
# SSH 점검 도구(#213): run_host_check는 l2·l3. [[tools.ssh.hosts]]가 비어 있으면 등록되지 않는다
# 유사 사례 검색(#313, D-053): search_similar_cases는 l1·l2. l3에 넣지 않는다.
# 환경변수 QDRANT_URL이 없으면 등록되지 않는다
# 위협 인텔 조회(#309): lookup_indicator는 l1·l2. l3에 넣지 않는다(무료 키 분당 4건을 헌팅이 쓰지 않게).
# 환경변수 VT_API_KEY가 없으면 등록되지 않는다
# 로컬 ATT&CK·KEV 조회(#311): get_attack_technique·search_attack_techniques·get_cve는 l2·l3
l1 = [
    "get_alert", "get_event", "query_records", "query_http_flow", "summarize_http_flow",
    "query_siem", "lookup_indicator", "search_similar_cases",
]
l2 = [
    "get_alert", "get_event", "query_records", "query_http_flow", "summarize_http_flow",
    "query_siem", "count_siem", "run_host_check", "lookup_indicator",
    "get_attack_technique", "search_attack_techniques", "get_cve", "search_similar_cases",
]
l3 = [
    "get_alert", "get_event", "query_records", "query_http_flow", "summarize_http_flow",
    "query_siem", "count_siem", "run_host_check",
    "get_attack_technique", "search_attack_techniques", "get_cve",
]

# SIEM 조회 도구(#212). 수집(#218)과 같은 ELK에 같은 환경변수로 접속한다.
# SIEM 연결·프로필(D-021)이 생기면 그것으로 바꾼다.
# 부르는 API는 POST /<index>/_search 하나다. 키는 대상 인덱스의 read 권한만 있는 API 키(D-010).
[tools.siem]
# ELK 주소(http(s), 계정 정보 없이)와 읽기 전용 API 키를 담은 환경변수 이름. 값은 .env에만 둔다
url_env = "ELK_URL"
api_key_env = "ELK_API_KEY"
# 요청 단위 제한 시간(초). 넘으면 TOOL_ERROR code=timeout
connect_timeout_seconds = 5

read_timeout_seconds = 10
# 호출 한 번의 전체 마감 시간(초, D-039). 넘으면 TOOL_ERROR code=timeout
deadline_seconds = 15
# 응답 크기 상한(압축을 푼 바이트). 넘으면 끊고 TOOL_ERROR code=failed
max_bytes = 5_242_880  # 5MB
# 자체 서명 HTTPS ELK의 CA 인증서 파일(PEM) 경로(#264). 비밀이 아니라 설정 값이다.
# 빈 값이면 httpx 기본 신뢰 저장소를 쓴다. 파일을 읽지 못하면 TOOL_ERROR code=failed(reason config).
# 실제 경로는 config/local.toml에 적는다(절대 경로 권장). http 주소에는 쓰이지 않는다
ca_cert_path = ""

# 조회 대상. name은 코드에 정해진 alerts | web_access | cloudtrail 중 하나다(다른 이름은 provider_error).
# 대상별 필터·반환 필드는 코드(soc.tools.siem)에 있다. 여기서는 index·time_field만 붙인다.
# 아래 index는 예시(#218 [[ingest.sources]]와 같은 패턴)다. 실제 값은 config/local.toml에서 바꾼다.
# 대상을 빼면 모델이 그 대상을 고를 때 invalid_argument다.
[[tools.siem.targets]]
name = "alerts"
index = ".alerts-security.alerts-default"
time_field = "@timestamp"

[[tools.siem.targets]]
name = "web_access"
index = "logs-nginx.access-*,logs-apache.access-*"
time_field = "@timestamp"

[[tools.siem.targets]]
name = "cloudtrail"
index = "logs-aws.cloudtrail-*"
time_field = "@timestamp"

# ELK 원본 수집(#218). Event·Alert 원본을 RawRecord로 보관하고 체크포인트로 이어서 조회한다.
# 실행: uv run python -m soc.ingest (한 번 실행하고 끝난다. 주기 실행은 cron이 한다)
[ingest]
# 저장하는 RawRecord·체크포인트의 siem_profile. 바꾸면 같은 문서가 새로 저장된다
siem_profile = "elk-default"
# ELK 주소(http(s), 계정 정보 없이)와 읽기 전용 API 키를 담은 환경변수 이름(D-010)
url_env = "ELK_URL"
api_key_env = "ELK_API_KEY"
# 한 번에 받는 문서 수(최대 10000)
page_size = 500
# 요청 단위 제한 시간(초)
connect_timeout_seconds = 10
read_timeout_seconds = 30
# 응답 하나(PIT 열기, 페이지 하나)의 크기 상한(압축을 푼 바이트)과 마감 시간(초)
max_bytes = 52_428_800  # 50MB
deadline_seconds = 60
# 자체 서명 HTTPS ELK의 CA 인증서 파일(PEM) 경로(#264). 비밀이 아니라 설정 값이다.
# 빈 값이면 httpx 기본 신뢰 저장소를 쓴다. 파일을 읽지 못하면 설정 오류로 종료 코드 2다.
# 실제 경로는 config/local.toml에 적는다(절대 경로 권장). http 주소에는 쓰이지 않는다
ca_cert_path = ""

# 조회 대상. kind: alert | event, key: alias·인덱스·데이터 스트림 패턴, time_field: 커서로 쓰는 시각 필드.
# (kind, key)마다 체크포인트가 하나다. key를 바꾸면 그 대상은 처음부터 다시 조회한다.
# Alert는 space별 alias(기본 space는 default).
[[ingest.sources]]
kind = "alert"
key = ".alerts-security.alerts-default"
time_field = "@timestamp"

# Event는 웹·클라우드를 먼저 둔다. time_field는 아직 @timestamp다.
# @timestamp를 커서로 쓰면 색인이 늦게 끝난 문서(@timestamp가 커서보다 과거)를 놓친다(로컬 확인: .local/elk/late_arrival.py).
# event.ingested(ECS, 도착 시각)는 그 문제를 줄인다. 실제 ELK에 필드가 있는지 확인한 뒤 바꾼다:
#   curl -s "$ELK_URL/logs-nginx.access-*/_search?size=1&filter_path=hits.hits._source.event.ingested"
[[ingest.sources]]
kind = "event"
key = "logs-nginx.access-*"
time_field = "@timestamp"

[[ingest.sources]]
kind = "event"
key = "logs-apache.access-*"
time_field = "@timestamp"

[[ingest.sources]]
kind = "event"
key = "logs-aws.cloudtrail-*"
time_field = "@timestamp"

[[ingest.sources]]
kind = "event"
key = "logs-azure.activitylogs-*"
time_field = "@timestamp"

[[ingest.sources]]
kind = "event"
key = "logs-gcp.audit-*"
time_field = "@timestamp"

# SSH 호스트 점검 도구(#213, SSH 도구 D-011, asyncssh D-041). 읽기 전용 계정으로 접속한다.
# 점검(processes, listening_ports, recent_logins, auth_log_tail, file_hash)의 명령과 인자 모양은
# 코드(soc.tools.ssh)에 있다. 설정은 호스트마다 켤 점검만 정하고, 명령 문자열은 받지 않는다.
[tools.ssh]
# OpenSSH 개인 키 본문(여러 줄)을 담은 환경변수 이름. 키 파일 경로는 두지 않는다. 값은 .env에만 둔다
key_env = "SSH_TOOL_PRIVATE_KEY"
# 암호가 걸린 키의 암호를 담은 환경변수 이름. 빈 문자열이면 쓰지 않는다(예: "SSH_TOOL_KEY_PASSPHRASE")
passphrase_env = ""
# 접속·명령 제한 시간(초). 넘으면 TOOL_ERROR code=timeout
connect_timeout_seconds = 5
command_timeout_seconds = 10
# 호출 한 번의 전체 마감 시간(초, D-039와 같은 뜻). 넘으면 TOOL_ERROR code=timeout
deadline_seconds = 15
# stdout·stderr를 각각 이 바이트까지만 읽는다. stdout이 넘으면 끊고 stdout_truncated=true(오류 아님)
max_output_bytes = 65_536  # 64KB
# 결과에 담는 stderr 앞부분 글자 수
max_stderr_chars = 2000
# 점검할 호스트. 기본은 비어 있어 도구가 등록되지 않는다(전부 거부).
# 실제 값은 config/local.toml(커밋 안 함)에 [[tools.ssh.hosts]]로 적는다. 예:
#   [[tools.ssh.hosts]]
#   name = "web01"                 # 모델에게 보이는 이름. [a-z0-9-], 주소·계정을 넣지 않는다
#   address = "192.0.2.10"         # 호스트 이름 또는 IP(계정 없이)
#   port = 22
#   username = "soc-reader"        # 읽기 권한만 가진 계정
#   host_key = "ssh-ed25519 AAAA…" # 공개 호스트 키 한 줄(ssh-keyscan 결과에서 호스트 이름을 뺀 것)
#   checks = ["processes", "listening_ports", "recent_logins", "auth_log_tail", "file_hash"]
hosts = []

# 위협 인텔 조회 도구 lookup_indicator(#309, D-051). VirusTotal API v3(무료 키)에 지표 값
# (IP·도메인·해시)만 보낸다. 주소·경로는 코드 상수이고, 사설·예약 대역과 비공개 이름
# (.local, .internal 등)은 코드가 막는다. 아래 제외 목록은 거기에 더하는 값이다.
# 캐시와 호출 한도는 프로세스 메모리에 있다. 재시작하거나 프로세스가 여럿이면 따로 센다.
# 무료 키 약관은 상업 이용을 제한한다.
[tools.threat_intel]
# VirusTotal API 키를 담은 환경변수 이름. 값은 .env에만 둔다. 환경변수가 없으면 도구가 등록되지 않는다
api_key_env = "VT_API_KEY"
# 요청 단위 제한 시간(초)과 호출 한 번의 전체 마감 시간(초, D-039)
connect_timeout_seconds = 5
read_timeout_seconds = 10
deadline_seconds = 15
# 응답 크기 상한(압축을 푼 바이트)
max_bytes = 1_048_576  # 1MB
# 무료 키 한도. 넘으면 호출하지 않고 status=rate_limited. 일 한도는 UTC 날짜로 센다
per_minute = 4
per_day = 500
# 같은 지표를 캐시에서 돌려주는 시간(초)과 캐시 최대 항목 수(넘으면 오래된 것부터 버린다)
cache_ttl_seconds = 86_400
cache_max_entries = 1000
# 외부로 보내지 않을 값을 더한다. exclude_cidrs는 CIDR, exclude_domains는 도메인 접미사
# (corp.example.com이면 그 아래 이름 전부). 회사의 공개 도메인은 여기에 적지 않으면 나간다.
# 실제 값은 config/local.toml(커밋 안 함)에 적는다
exclude_cidrs = []
exclude_domains = []

# 로컬 ATT&CK·KEV 조회 도구(#311, D-052): get_attack_technique, search_attack_techniques, get_cve.
# 네트워크 없이 soc.l3.intel이 PostgreSQL에 저장한 사본만 읽는다(읽기 역할 soc_agent_reader).
# 허용 단계는 l2·l3다. 환경변수는 따로 없고 AGENT_DATABASE_URL을 쓴다.
[tools.local_intel]
# 읽을 ATT&CK 버전. L3 수집 설정(l3.intel.attack 표)의 version과 같은 값이어야 하므로
# 버전을 올릴 때 함께 바꾼다.
# 다르면 도구가 status=no_data(attack_version_missing)를 돌려준다
attack_version = "20.0"
# 설명·KEV 요약·필수 조치 문구 하나의 글자 수 상한
description_max_chars = 600
# 하위 기법·탐지 데이터 소스 목록의 항목 수 상한
list_max_items = 20

# 유사 사례 검색 도구 search_similar_cases(#313, D-053). 판정이 끝난 Ticket을 임베딩으로 찾는다.
# 허용 단계는 l1·l2다. Qdrant 주소는 [store.qdrant]의 환경변수, DB는 AGENT_DATABASE_URL을 쓴다.
# 색인은 L1 판정 직후에 쓰고, 이미 쌓인 Ticket은 uv run python -m soc.similar reindex로 채운다.
[tools.similar_cases]
# limit 인자를 주지 않을 때의 건수와 모델이 줄 수 있는 상한
limit_default = 5
limit_max = 10
# 이 유사도(코사인, 0~1) 아래는 결과에서 뺀다. bge-m3 실모델로 영어 Alert 제목 11개(55쌍)를 재서 정한
# 값이다. 근거와 한계는 docs/notes/313-similar-cases-tool.md
min_score = 0.6
# query 인자의 글자 수 상한(로그 원문을 통째로 넣지 못하게 한다)
query_max_chars = 200
# 결과의 판정 이유 요약 글자 수 상한
reason_max_chars = 300
# 결과 하나에 담는 대표 엔티티 수 상한
entities_max = 5

# L2 Ticket 분류 후보 만들기(#226, Incident 분류 방법 D-027).
[l2.branch]
# 후보로 볼 열린 Incident의 updated_at 시간 창(밀리초)
candidate_window_ms = 86_400_000
# 다음 단계에 보여 줄 후보 수 상한
max_candidates = 5
# 후보 조회 경로. vector | recent
candidate_source = "vector"
# Qdrant에서 가져올 비슷한 Ticket 수
top_k = 50

# L2 Incident 분석(#261, #270). 연속 실패 3회에 held로 두고 1시간 뒤 재시도한다.
[l2.analyze]
lookback_ms = 259_200_000
max_failures = 3
failure_retry_cooldown_ms = 3_600_000
max_seed_entities = 10
max_related_per_entity = 20

# 벡터 저장소와 임베딩(#257, Qdrant D-013, 임베딩 모델 D-031, 실행 라이브러리 D-044).
# L2·L3가 함께 쓰는 공통 계층이다. 컬렉션 이름은 용도·모델 ID·revision·ONNX 파일에서 코드가 만든다.
[store.qdrant]
# Qdrant 주소(http(s), 계정 정보 없이)를 담은 환경변수 이름. 값은 .env에만 둔다
url_env = "QDRANT_URL"

[store.embedder]
# 기본 임베딩 모델(D-031). dense 표현만 쓰고 1024차원·Cosine이다.
# revision을 바꾸면 컬렉션 이름이 달라져 색인을 다시 만들어야 한다(옛 컬렉션은 사람이 지운다).
model_id = "BAAI/bge-m3"
revision = "5617a9f61b028005a4858fdac845db406aefb181"

# L3 가설 재료 수집(#221, L3 위협 시나리오 입력 D-029). 모두 공개 피드라 비밀 값이 없다.
# 실행: uv run python -m soc.l3.intel
[l3.intel]
# 요약(태그를 지운 평문) 길이 상한. 넘으면 자른다
summary_max_chars = 1000
# 요청 단위 제한 시간(초). 출처별 전체 마감 시간은 limits·attack의 deadline_seconds
connect_timeout_seconds = 10
read_timeout_seconds = 10

# 출처 종류별 응답 크기 상한(압축을 푼 바이트)과 전체 마감 시간(초)
[l3.intel.limits.rss]
max_bytes = 5_242_880  # 5MB
deadline_seconds = 30

[l3.intel.limits.cisa_kev]
max_bytes = 10_485_760  # 10MB
deadline_seconds = 30

# 출처 목록. name은 저장 키의 일부라, 바꾸면 같은 기사가 새로 저장된다.
# kind: rss | cisa_kev. 주소는 https만 받는다. 리다이렉트는 따라가지 않는다.
[[l3.intel.sources]]
name = "boannews"
kind = "rss"
url = "https://cdn.boannews.com/rss/gn_rss_allArticle.xml"

[[l3.intel.sources]]
name = "thehackernews"
kind = "rss"
url = "https://feeds.feedburner.com/TheHackersNews"

[[l3.intel.sources]]
name = "cisa_kev"
kind = "cisa_kev"
url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"

# MITRE ATT&CK Enterprise(D-040). 같은 버전이 이미 저장돼 있으면 내려받지 않는다.
# 버전을 올릴 때는 version과 url을 함께 바꾼다. 받은 파일의 버전이 다르면 실패한다.
[l3.intel.attack]
version = "20.0"
url = "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack-20.0.json"
max_bytes = 104_857_600  # 100MB
deadline_seconds = 180

# L3 가설 헌팅(#223). 실행: uv run python -m soc.l3 hunt
# 수집 → 가설 생성 run 1회 → pending Hunt 검증. ATT&CK 기법은 [l3.intel.attack] version으로 고른다.
[l3.hunt]
# 헌팅 전에 soc.l3.intel 수집을 한 번 돌린다. 수집이 실패해도 저장된 뉴스로 계속한다
collect_before = true
# 가설 생성 입력: 최근 news_window_days일 뉴스 최대 news_limit건(발행 시각이 없으면 처음 받은 시각),
# 최근 확정 Case 최대 case_limit건
news_window_days = 3
news_limit = 5
case_limit = 3
# 가설 생성 run 한 번에 저장할 가설 수. 넘는 것은 버린다
max_hypotheses = 1
# 검증 run의 조회 기간(일). 검증을 시작한 시각부터 거슬러 센다
lookback_days = 7
# 이 확신도 미만인 confirmed는 inconclusive로 저장한다
confirm_threshold = 0.7
# 검증 run 시도 한도. 실패가 이 횟수에 이르면 Hunt는 failed다. 종료로 끊긴 run(cancelled)은 세지 않는다
max_attempts = 2
# 실행기 생성 워커의 가설 생성 간격(초, #245). 마지막 시도(실패 포함, cancelled 제외)부터 센다.
# 수동 명령(soc.l3 hunt)은 이 값을 보지 않고 매번 생성한다
generate_interval_seconds = 86400

# 정규화(#234). 실행: uv run python -m soc.normalize (한 번 실행하고 끝난다. 주기 실행은 cron이 한다)
# DB 주소는 환경변수 DATABASE_URL. 자산 조회도 같은 연결로 한다.
[normalize]
# 한 번 실행에서 맡는 원본 수
batch_size = 200
# 작업자가 한 묶음을 맡는 시간(초). 묶음을 다 처리하는 시간보다 길어야 한다.
# 넘으면 다음 작업자가 아직 처리하지 못한 원본을 다시 맡을 수 있다
lease_seconds = 600
# 결과를 저장하는 DB의 접속 시간 상한(초)
connect_timeout_seconds = 5

# 자산 조회(#241). 정규화가 Entity마다 자산 정보를 붙일 때 쓴다
[asset_lookup]
# 조회 문장 하나의 시간 상한(밀리초). 넘으면 정규화가 asset_lookup_failed로 실패한다
statement_timeout_ms = 5000

# 화면용 API(FastAPI, D-016, #239). 실행: uv run python -m soc.api
# DB 주소는 환경변수 DATABASE_URL. 조회 요청은 읽기 전용이고, 인증·사용자 관리·정책 PUT만 쓰기 연결을 쓴다.
# 기법 이름은 [l3.intel.attack] version의 attack_techniques에서 찾는다.
[api]
# 바인딩 주소. 기본은 로컬에만 연다. 인증(D-020)이 있어도 바꾸려면 여기서 바꾼다(D-042)
host = "127.0.0.1"
port = 8000
# 요청 DB 세션의 문장 시간 상한(밀리초)
statement_timeout_ms = 5000
# DB 접속 시간 상한(초)
connect_timeout_seconds = 5

# 로그인·세션(D-020, #284). 사용자 계정은 PostgreSQL에 있고 비밀 값은 여기에 두지 않는다.
[auth]
# 마지막 사용 뒤 이 시간이 지나면 세션이 끝난다(초)
idle_timeout_seconds = 3600
# 로그인 뒤 이 시간이 지나면 쓰던 중이어도 세션이 끝난다(초)
absolute_timeout_seconds = 43200
cookie_name = "soc_session"
# HTTPS로 배포할 때 true. 로컬 http에서는 false여야 브라우저가 쿠키를 보낸다
cookie_secure = false
# 변경 요청(POST/PUT/PATCH/DELETE)의 Origin 허용 목록. 개발 서버(Vite) 두 주소가 기본이다.
# 배포 주소는 config/local.toml에서 바꾼다
allowed_origins = ["http://127.0.0.1:5173", "http://localhost:5173"]

# Ticket 정책(#246). 정책 API에서 저장한 활성 DB 행이 있으면 이 기본값보다 우선한다.
[ticketing]
mode = "auto"
scenario_rule_ids = []
