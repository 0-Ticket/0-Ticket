[project]
name = "0-ticket-soc"
version = "0.1.0"
description = "AI 네이티브 SOC 파이프라인"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soc"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "soc/contracts/schemas"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, B: 흔한 버그, UP: 최신 문법
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: 실제 LLM을 호출하는 테스트. 기본 실행에서 제외, uv run pytest -m llm 으로 실행"]
addopts = "-m 'not llm'"
