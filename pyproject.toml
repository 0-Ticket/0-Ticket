[project]
name = "0-ticket-soc"
version = "0.1.0"
description = "AI 에이전트 기반 SOC 파이프라인"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "asyncssh==2.24.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "huggingface-hub==2.4.0",
    "jsonschema>=4.26.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "openai==3.42.1",
    "openai-agents==0.24.0",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "qdrant-client==1.20.0",
    "tokenizers==0.23.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.88.0",
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soc"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, B: 흔한 버그, UP: 최신 문법
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 생성 코드는 손으로 고칠 수 없고, schema 설명 문장이 한 줄로 생성돼 100자를 넘는다(D-038).
"src/soc/contracts/generated/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ingest/ 아래 계층 폴더가 fake_elk를 같은 이름으로 import한다
pythonpath = ["tests", "tests/ingest"]
markers = [
    "llm: 실제 LLM을 호출하는 테스트. uv run pytest -m llm 으로 실행",
    "db: PostgreSQL이 필요한 테스트. uv run pytest -m db 으로 실행",
    "qdrant: Qdrant가 필요한 테스트. uv run pytest -m qdrant 으로 실행",
    "embedder: 실제 BGE-M3 모델을 내려받아 추론하는 테스트(약 2.27GB). uv run pytest -m embedder 으로 실행(docs/notes/257-vector-store-embedder.md)",
    "elk: 실제 ELK에 접속하는 테스트. uv run pytest -m elk 으로 실행(docs/notes/212-siem-tools.md)",
    "ssh: 실제 SSH 호스트에 접속하는 테스트. uv run pytest -m ssh 으로 실행(docs/notes/213-ssh-tool.md)",
]
addopts = "-m 'not llm and not db and not qdrant and not embedder and not elk and not ssh'"
