[project]
name = "0-ticket-soc"
version = "0.1.0"
description = "AI 네이티브 SOC 파이프라인"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, B: 흔한 버그, UP: 최신 문법
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: 실제 LLM을 호출하는 테스트. 기본 실행에서 제외, uv run pytest -m llm 으로 실행"]
addopts = "-m 'not llm'"